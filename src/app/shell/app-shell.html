<a class="skip-link" href="#main">Skip to content</a>

<div class="top-row">
  <nav class="modes" aria-label="Analysis modules">
    @for (group of groups; track group.id) {
      <div class="mode-group" role="group" [attr.aria-label]="group.label">
        <p class="bracket" [style.grid-column]="'span ' + group.modules.length" aria-hidden="true">
          <span>{{ group.label }}</span>
        </p>
        @for (module of group.modules; track module.id) {
          <a
            class="mode-key"
            [routerLink]="['/', module.path]"
            routerLinkActive="active"
            ariaCurrentWhenActive="page"
            [title]="module.title"
          >
            <span class="mode-led" aria-hidden="true"></span>
            <app-icon [name]="module.icon" [size]="18" />
            <span class="mode-legend" aria-hidden="true">{{ module.key }}</span>
            <span class="visually-hidden">{{ module.title }}</span>
          </a>
        }
      </div>
    }
  </nav>
  <div class="grille" aria-hidden="true"></div>
</div>

<main id="main" class="workspace" tabindex="-1">
  <router-outlet />
</main>
