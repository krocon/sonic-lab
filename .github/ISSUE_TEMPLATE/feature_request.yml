name: Feature request
description: Suggest an improvement or a new module
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would it solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed solution
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: The feature works fully on the device (no server, no upload).
