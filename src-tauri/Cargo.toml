[package]
name = "audiolab"
version = "0.1.0"
description = "AudioLab – local, privacy-first audio signal analyzer (Tauri 2 + Angular)"
authors = ["krocon"]
license = "MIT"
edition = "2024"
rust-version = "1.90"

[lib]
# Distinct lib name avoids the bin/lib name clash on Windows (cargo issue #8519).
name = "audiolab_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
# No Tauri plugins on purpose: audio is captured by the WebView (getUserMedia), so the
# desktop shell needs no file-system, shell or HTTP access yet (docs/PRIVACY.md).
tauri = { version = "2.12.5", features = [] }
serde = { version = "1.0", features = ["derive"] }
# Already in the tree through Tauri; used for the window-state file.
serde_json = "1.0"
# Native save dialog for exports. Registered in Rust only – no dialog permission is granted to the
# frontend; it reaches the dialog solely through the `export_file` command (docs/PRIVACY.md).
tauri-plugin-dialog = "2.8.4"

# WebKitGTK settings (enable media streams); already in the tree through Tauri/wry.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2.0.2", features = ["v2_40"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
